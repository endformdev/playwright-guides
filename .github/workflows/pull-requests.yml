name: Scaled suite on pull requests

# Runs the scaled suite against each pull request's preview deployment,
# including the demo pull requests the scenario workflow refreshes.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  scaled-suite:
    # Pull requests from forks don't get the secrets, so they're skipped.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/run-suite.yml
    with:
      suite: 03-scaled-suite
      vercel-project: endform-playwright-guides
    secrets:
      endform-api-key: ${{ secrets.ENDFORM_FLAGSHIP_API_KEY }}
      vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
