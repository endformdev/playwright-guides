name: Flake lab

# Runs the flake lab against the flaky app every 6 hours, building up weeks
# of flake history in the Flake Lab demo organization. Its tests are meant to
# fail now and then, so failures don't fail the workflow.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  flake-lab:
    if: github.repository == 'endformdev/playwright-guides'
    uses: ./.github/workflows/run-suite.yml
    with:
      suite: 05-flake-lab
      vercel-project: endform-playwright-guides-flaky
      allow-failure: true
    secrets:
      endform-api-key: ${{ secrets.ENDFORM_FLAKE_LAB_API_KEY }}
