name: Refresh scenario pull requests

# Each patch in scenarios/ is kept as an open demo pull request. This resets
# each demo branch to main, applies its patch and force-pushes it, so the pull
# requests always have recent runs and never drift out of date with main.
#
# It pushes and opens the pull requests as the endform-guides-scenarios GitHub
# App. Pushes made with the workflow's own token don't start other workflows,
# but the App's do, so each push runs the scaled suite through the normal
# pull request workflow and its result shows on the pull request.

on:
  schedule:
    - cron: "0 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'endformdev/playwright-guides'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: checkout-regression
            title: Validate plan names against the plan catalog
            summary: >-
              Looks up the purchased plan in a catalog keyed by plan id. The
              pricing page still sends plan names, so every checkout fails,
              and the scaled suite's upgrade tests catch it.
          - scenario: pricing-flow-change
            title: Rename the Plus plan to Pro and raise its price to $15
            summary: >-
              An intended product change. The pricing page and every test
              that mentions the Plus plan are updated together, so the suite
              passes with changed tests.
    env:
      SCENARIO: ${{ matrix.scenario }}
      BRANCH: demo/${{ matrix.scenario }}
      TITLE: ${{ matrix.title }}
      SUMMARY: ${{ matrix.summary }}
    steps:
      - name: Get a token for the scenarios App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SCENARIOS_APP_ID }}
          private-key: ${{ secrets.SCENARIOS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Reset the demo branch to main and apply the patch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # --index stages everything the patch touches, including files it
          # adds, such as regenerated playwright-intent steps.
          git apply --index "scenarios/$SCENARIO.patch"
          git commit --message "$TITLE"
          git push --force origin "$BRANCH"

      - name: Open the demo pull request if it isn't open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$SUMMARY

          This is a demo pull request for Endform's guides. It is recreated from \`scenarios/$SCENARIO.patch\` twice a week. Don't merge it."
          fi
